
name: HPJ Android AAB Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HPJ Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          if [ -f HarvestPlaceJa/pubspec.yaml ] && [ -d HarvestPlaceJa/android ]; then
            echo "dir=HarvestPlaceJa" >> "$GITHUB_OUTPUT"
          elif [ -f pubspec.yaml ] && [ -d android ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Flutter Android project not found."
            exit 1
          fi

      - name: Install Flutter dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Build Android App Bundle
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HPJ-Android-AAB
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
