
name: HPJ Android AAB Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed HPJ AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HarvestPlaceJa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore Android signing keystore
        shell: bash
        env:
          HPJ_KEYSTORE_BASE64: ${{ secrets.HPJ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HPJ_KEYSTORE_BASE64"
          printf '%s' "$HPJ_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/hpj-upload-key.jks
          test -s android/app/hpj-upload-key.jks
          chmod 600 android/app/hpj-upload-key.jks

      - name: Build signed Android App Bundle
        env:
          CM_KEYSTORE_PATH: hpj-upload-key.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.HPJ_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: harvestplace
          CM_KEY_PASSWORD: ${{ secrets.HPJ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_PASSWORD"
          flutter build appbundle --release

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: HPJ-Signed-Android-AAB
          path: HarvestPlaceJa/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/hpj-upload-key.jks
