name: farm
description: Fresh local food ordering and farm updates for The Harvest Place Ja.
publish_to: 'none'

version: 1.0.4+43

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # =====================================================
  # SUPABASE
  # =====================================================
  supabase_flutter: ^2.5.6

  # =====================================================
  # FIREBASE / PUSH NOTIFICATIONS
  # =====================================================
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # =====================================================
  # FOREGROUND + SCHEDULED LOCAL NOTIFICATIONS
  # Used for HPJ alerts and Farmer Calendar reminders.
  # =====================================================
  flutter_local_notifications: 19.5.0

  # =====================================================
  # TIMEZONE
  # Used for Farmer Calendar scheduled reminders.
  # =====================================================
  timezone: ^0.10.1

  # =====================================================
  # APP FEATURES
  # =====================================================
  app_links: ^6.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # =====================================================
  # WHATSAPP IMAGE SHARING / HPJ ADVERTISING
  # =====================================================
  share_plus: 11.1.0

  # =====================================================
  # FRESH REELS
  # =====================================================
  video_player: 2.9.5

  # =====================================================
  # SMART LOCAL PREFERENCES / RESUME MEMORY
  # Also stores Farmer Calendar reminder records locally.
  # =====================================================
  shared_preferences: ^2.3.5

  # =====================================================
  # CLOUDFLARE TURNSTILE CAPTCHA
  # =====================================================
  cloudflare_turnstile: ^3.8.1

  # =====================================================
  # PDF RECEIPT / ORDER SLIP PRINTING
  # =====================================================
  pdf: ^3.11.0
  printing: ^5.14.0


# =====================================================
# FLUTLAB / FLUTTER 3.32 COMPATIBILITY
# =====================================================
dependency_overrides:
  firebase_core_web: 3.10.0


# =====================================================
# DEVELOPMENT DEPENDENCIES
# =====================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4


# =====================================================
# FLUTTER
# =====================================================
flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/


# =====================================================
# HPJ ANDROID LAUNCHER ICON — MVP
#
# Uses the simplified HPJ mark instead of the full logo
# so Android does not crop the business name/tagline.
# =====================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false

  # Standard / legacy Android icon
  image_path: "lib/assets/images/hpj_app_icon_mvp.png"

  # Android adaptive icon
  adaptive_icon_background: "#F7FAF2"
  adaptive_icon_foreground: "lib/assets/images/hpj_app_icon_foreground_mvp.png"

  # Adds safe breathing room around HPJ inside Android masks
  adaptive_icon_foreground_inset: 24

  min_sdk_android: 21
