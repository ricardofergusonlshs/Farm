<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <!-- Responsive web -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HPJ website identity -->
  <meta
    name="description"
    content="The Harvest Place Ja connects customers, farmers and businesses with fresh Jamaican produce."
  >
  <meta name="application-name" content="The Harvest Place Ja">
  <meta name="theme-color" content="#1F6B3B">

  <!-- These tags are in the initial HTML response for WhatsApp and Facebook.
       The image must be deployed at /og-hpj.png and accessible publicly. -->
  <link rel="canonical" href="https://harvestplaceja.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Harvest Place Ja">
  <meta property="og:title" content="The Harvest Place Ja | Fresh Jamaican Produce">
  <meta property="og:description" content="Fresh • Local • Jamaican. Discover Jamaican produce and connect with local farmers and businesses at The Harvest Place Ja.">
  <meta property="og:url" content="https://harvestplaceja.com/">
  <meta property="og:image" content="https://harvestplaceja.com/og-hpj.png">
  <meta property="og:image:secure_url" content="https://harvestplaceja.com/og-hpj.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="720">
  <meta property="og:image:height" content="720">
  <meta property="og:image:alt" content="The Harvest Place Ja logo — Fresh, Local, Jamaican">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="The Harvest Place Ja | Fresh Jamaican Produce">
  <meta name="twitter:description" content="Fresh • Local • Jamaican. Discover Jamaican produce and local farmers.">
  <meta name="twitter:image" content="https://harvestplaceja.com/og-hpj.png">

  <!-- Mobile / PWA -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS / Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="The Harvest Place Ja">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Browser title -->
  <title>The Harvest Place Ja | Fresh Jamaican Produce</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Passkeys Web SDK required for FlutLab / Flutter Web preview -->
  <script
    src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"
    type="application/javascript"
  ></script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
